spring.application.name=demo

# H2 database stored in ./data/ems.mv.db (AUTO_SERVER lets the H2 console and the app share it)
spring.datasource.url=jdbc:h2:file:./data/ems;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Tables come from schema.sql (and first-run sample data from data.sql), not from Hibernate
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console (JDBC URL as above, user sa, empty password).
# Turned off in deployment (H2_CONSOLE=false) because the app has no login.
spring.h2.console.enabled=${H2_CONSOLE:true}

# Render (and similar hosts) supply the port and sit behind an HTTPS proxy
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Keep session ids out of URLs
server.servlet.session.tracking-modes=cookie
