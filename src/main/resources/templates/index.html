<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments :: head('Dashboard')}"></head>

<body>
	<nav th:replace="~{fragments :: navbar}"></nav>

	<main class="container py-4">
		<div th:replace="~{fragments :: flash}"></div>

		<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
			<div>
				<h1 class="page-title">Dashboard</h1>
				<p class="text-secondary mb-0">An overview of your organisation.</p>
			</div>
			<a th:href="@{/employees/new}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Add employee</a>
		</div>

		<div class="row g-3 mb-4">
			<div class="col-sm-6 col-lg-4">
				<a th:href="@{/employees}" class="card stat-card text-decoration-none h-100">
					<div class="card-body d-flex align-items-center gap-3">
						<span class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-people"></i></span>
						<div>
							<div class="stat-value" th:text="${employeeCount}">0</div>
							<div class="stat-label">Employees</div>
						</div>
					</div>
				</a>
			</div>
			<div class="col-sm-6 col-lg-4">
				<a th:href="@{/departments}" class="card stat-card text-decoration-none h-100">
					<div class="card-body d-flex align-items-center gap-3">
						<span class="stat-icon bg-success-subtle text-success"><i class="bi bi-diagram-3"></i></span>
						<div>
							<div class="stat-value" th:text="${departmentCount}">0</div>
							<div class="stat-label">Departments</div>
						</div>
					</div>
				</a>
			</div>
			<div class="col-sm-12 col-lg-4">
				<div class="card stat-card h-100">
					<div class="card-body d-flex align-items-center gap-3">
						<span class="stat-icon bg-warning-subtle text-warning-emphasis"><i class="bi bi-bar-chart"></i></span>
						<div>
							<div class="stat-value"
								th:text="${departmentCount > 0} ? ${#numbers.formatDecimal(1.0 * employeeCount / departmentCount, 1, 1)} : '0'">0</div>
							<div class="stat-label">Avg. employees per department</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="card">
			<div class="card-header bg-transparent d-flex justify-content-between align-items-center">
				<h2 class="h6 mb-0 fw-semibold">Headcount by department</h2>
				<a th:href="@{/departments/new}" class="btn btn-sm btn-outline-secondary"><i
						class="bi bi-plus-lg me-1"></i>New department</a>
			</div>
			<div class="card-body">
				<div th:if="${#lists.isEmpty(summaries)}" class="empty-state">
					<i class="bi bi-diagram-3"></i>
					<p>No departments yet. Create one to start adding employees.</p>
					<a th:href="@{/departments/new}" class="btn btn-primary btn-sm">Create department</a>
				</div>
				<div th:each="s : ${summaries}" class="headcount-row">
					<a th:href="@{/employees(departmentId=${s.id})}" class="headcount-name" th:text="${s.name}">Dept</a>
					<div class="progress flex-grow-1" role="progressbar" th:aria-valuenow="${s.employeeCount}"
						aria-valuemin="0" th:aria-valuemax="${maxHeadcount}">
						<div class="progress-bar" th:style="'width:' + ${s.employeeCount * 100 / maxHeadcount} + '%'"></div>
					</div>
					<span class="headcount-count" th:text="${s.employeeCount}">0</span>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>

</html>
