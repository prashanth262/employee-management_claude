<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments :: head('Employees')}"></head>

<body>
	<nav th:replace="~{fragments :: navbar}"></nav>

	<main class="container py-4">
		<div th:replace="~{fragments :: flash}"></div>

		<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
			<div>
				<h1 class="page-title">Employees</h1>
				<p class="text-secondary mb-0"><span th:text="${#lists.size(employees)}">0</span> shown</p>
			</div>
			<a th:href="@{/employees/new}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Add employee</a>
		</div>

		<form class="card mb-3" method="get" th:action="@{/employees}">
			<div class="card-body row g-2 align-items-center">
				<div class="col-md-6">
					<div class="input-group">
						<span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
						<input type="search" name="q" th:value="${q}" class="form-control"
							placeholder="Search by name, email or job title" aria-label="Search">
					</div>
				</div>
				<div class="col-md-4">
					<select name="departmentId" class="form-select" aria-label="Filter by department"
						onchange="this.form.submit()">
						<option value="">All departments</option>
						<option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"
							th:selected="${d.id == departmentId}">Dept</option>
					</select>
				</div>
				<div class="col-md-2 d-flex gap-2">
					<button type="submit" class="btn btn-outline-primary flex-grow-1">Search</button>
					<a th:if="${q != null or departmentId != null}" th:href="@{/employees}" class="btn btn-light"
						title="Clear filters"><i class="bi bi-x-lg"></i></a>
				</div>
			</div>
		</form>

		<div class="card">
			<div th:if="${#lists.isEmpty(employees)}" class="card-body empty-state">
				<i class="bi bi-person-x"></i>
				<p>No employees found.</p>
				<a th:href="@{/employees/new}" class="btn btn-primary btn-sm">Add an employee</a>
			</div>
			<div th:unless="${#lists.isEmpty(employees)}" class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead>
						<tr>
							<th>Employee</th>
							<th>Department</th>
							<th class="d-none d-lg-table-cell">Phone</th>
							<th class="text-end">Salary</th>
							<th class="d-none d-md-table-cell">Hire date</th>
							<th class="text-end">Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="e : ${employees}">
							<td>
								<div class="d-flex align-items-center gap-3">
									<span class="avatar"
										th:text="${#strings.toUpperCase(#strings.substring(e.firstName,0,1) + #strings.substring(e.lastName,0,1))}">AB</span>
									<div>
										<div class="fw-semibold" th:text="${e.fullName}">Name</div>
										<div class="small text-secondary">
											<span th:text="${e.jobTitle ?: '—'}">Title</span> ·
											<a th:href="'mailto:' + ${e.email}" th:text="${e.email}"
												class="link-secondary">email</a>
										</div>
									</div>
								</div>
							</td>
							<td><span class="badge rounded-pill text-bg-light border" th:text="${e.department.name}">Dept</span>
							</td>
							<td class="d-none d-lg-table-cell" th:text="${e.phone ?: '—'}">—</td>
							<td class="text-end font-monospace"
								th:text="${e.salary != null} ? ${#numbers.formatDecimal(e.salary, 1, 'COMMA', 2, 'POINT')} : '—'">
								0.00</td>
							<td class="d-none d-md-table-cell"
								th:text="${e.hireDate != null} ? ${#temporals.format(e.hireDate, 'dd MMM yyyy')} : '—'">—
							</td>
							<td class="text-end text-nowrap">
								<a th:href="@{/employees/{id}/edit(id=${e.id})}" class="btn btn-sm btn-outline-secondary"
									title="Edit"><i class="bi bi-pencil"></i></a>
								<button type="button" class="btn btn-sm btn-outline-danger" title="Delete"
									th:attr="data-delete-action=@{/employees/{id}/delete(id=${e.id})},data-delete-name=${e.fullName}">
									<i class="bi bi-trash3"></i></button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments :: deleteModal}"></div>
	<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>

</html>
