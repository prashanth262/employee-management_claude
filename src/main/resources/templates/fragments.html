<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' · Employee Management'">Employee Management</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

	<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark app-navbar">
		<div class="container">
			<a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
				<span class="brand-mark"><i class="bi bi-people-fill"></i></span>
				<span class="fw-semibold">EMS</span>
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
				aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNav">
				<ul class="navbar-nav ms-auto gap-md-1">
					<li class="nav-item">
						<a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/}">
							<i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:classappend="${activePage == 'employees'} ? 'active'"
							th:href="@{/employees}"><i class="bi bi-person-badge me-1"></i>Employees</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:classappend="${activePage == 'departments'} ? 'active'"
							th:href="@{/departments}"><i class="bi bi-diagram-3 me-1"></i>Departments</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<div th:fragment="flash">
		<div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2"
			role="alert">
			<i class="bi bi-check-circle-fill"></i><span th:text="${success}">Saved.</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2"
			role="alert">
			<i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}">Error.</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
	</div>

	<!-- Shared delete confirmation. Trigger with: data-delete-action="/url" data-delete-name="Name" -->
	<div th:fragment="deleteModal">
		<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header border-0">
						<h5 class="modal-title" id="deleteModalTitle"><i
								class="bi bi-trash3 text-danger me-2"></i>Confirm delete</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body pt-0">
						Are you sure you want to delete <strong id="deleteModalName"></strong>? This cannot be undone.
					</div>
					<div class="modal-footer border-0">
						<button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
						<form id="deleteModalForm" method="post">
							<button type="submit" class="btn btn-danger">Delete</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<th:block th:fragment="scripts">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			document.addEventListener('click', function (e) {
				const btn = e.target.closest('[data-delete-action]');
				if (!btn) return;
				document.getElementById('deleteModalForm').action = btn.dataset.deleteAction;
				document.getElementById('deleteModalName').textContent = btn.dataset.deleteName;
				bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteModal')).show();
			});
			document.querySelectorAll('.alert-success').forEach(function (el) {
				setTimeout(function () { bootstrap.Alert.getOrCreateInstance(el).close(); }, 4000);
			});
		</script>
	</th:block>

</body>

</html>
